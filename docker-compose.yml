services:

  customer-db:
    image: postgres:16
    container_name: customer-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - customer_db_data:/var/lib/postgresql/data

volumes:
  customer_db_data: